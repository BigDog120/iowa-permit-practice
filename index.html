<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Take a fresh 25-question Iowa instruction permit practice test and review every answer with references to the Iowa Driver’s Manual.">
<title>Iowa Permit Practice</title>
<style>
:root{color-scheme:light;--ink:#20231c;--sub:#555c52;--paper:#f3f4ef;--line:#dfe3d8;--green:#254c3c;--pale:#edf4ec;--gold:#f4cc66;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 system-ui,sans-serif}
button,input{font:inherit}
button,a,input{touch-action:manipulation}
a{color:var(--green);text-underline-offset:.22em}
:focus-visible{outline:3px solid #a05d18;outline-offset:4px}
h1,h2,h3,p{margin:0}
.wrap{width:min(1120px,calc(100% - 64px));margin-inline:auto}
.top{background:#172a22;color:#f6f8f0}
.brand{display:flex;align-items:center;gap:12px;min-height:66px;font-weight:700}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--gold);color:#233027;font-weight:850;font-size:.88rem;letter-spacing:.05em}
.hero{position:relative;overflow:hidden;background:#254c3c;color:#fff;border-bottom:4px solid var(--gold)}
.hero .wrap{position:relative;z-index:1;padding-block:42px 51px}
.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(2.55rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.047em;margin:0 0 15px}
.hero p{color:#ecf2e8;max-width:40ch}
.road{position:absolute;inset:-180px -60px -155px auto;width:37%;transform:rotate(28deg);border-inline:2px solid #70908065;background:#19372a70;pointer-events:none}
.road::before{content:"";position:absolute;height:100%;left:50%;border-left:3px dashed #edca6d8c}
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:24px;margin-block:30px 22px;align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.2vw,36px);box-shadow:0 4px 12px #232c2010}
.aside{padding:24px}
.barline,.cardhead,.actions,.result-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cardhead{margin-bottom:15px;flex-wrap:wrap}
.label{font-size:.875rem;font-weight:750;color:var(--green)}
.counter{color:var(--sub);font-size:.875rem;font-weight:650}
.pill{border-radius:100px;padding:4px 11px;background:var(--pale)}
h2{font:500 clamp(1.8rem,3.2vw,2.55rem)/1.16 Georgia,serif;letter-spacing:-.03em}
h3{font-size:1rem}
aside h2{font:750 1.08rem/1.2 system-ui,sans-serif;letter-spacing:0}
small,.muted{font-size:.875rem;color:var(--sub)}
.options{display:grid;gap:10px;margin-top:23px}
.option{display:flex;align-items:center;gap:11px;min-height:57px;text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;color:var(--ink);width:100%}
.option:hover,.button.secondary:hover,.grid button:hover{background:#f4f7f2}
.option[aria-pressed=true]{background:var(--pale);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.letter{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:#eef0ea;color:var(--green);display:grid;place-items:center;font-size:.875rem;font-weight:750}
.option[aria-pressed=true] .letter{background:var(--green);color:white}
.actions,.result-actions{border-top:1px solid var(--line);margin-top:24px;padding-top:19px;flex-wrap:wrap}
.button{appearance:none;color:#fff;background:var(--green);border:1px solid var(--green);border-radius:9px;padding:10px 15px;min-height:44px;font-weight:700;cursor:pointer}
.button:hover{background:#18372a}
.button.secondary{background:white;color:var(--green);border-color:#cbd4c9}
.button:disabled{opacity:.43;cursor:default}
.button.link{background:none;border-color:transparent;color:var(--green);text-decoration:underline;text-underline-offset:.2em;padding-inline:0}
.barline{margin-top:15px}
progress{width:100%;height:9px;border:0;border-radius:12px;display:block;appearance:none;background:#e7eae1;margin-top:8px;overflow:hidden}
progress::-webkit-progress-bar{background:#e7eae1}
progress::-webkit-progress-value{background:var(--green)}
progress::-moz-progress-bar{background:var(--green)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:19px 0 14px}
.grid button{min-height:38px;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--green);cursor:pointer;font-size:.875rem;padding:4px}
.grid button.done{background:var(--pale);font-weight:750}
.grid button[aria-current=step]{background:var(--green);color:white;border-color:var(--green);font-weight:750}
.target{border-top:1px solid var(--line);margin-top:13px;padding-top:15px}
.target strong{display:block;font-size:.875rem}
footer{padding:0 0 25px;color:var(--sub);font-size:.875rem}
footer .wrap{display:flex;gap:10px 18px;flex-wrap:wrap;justify-content:space-between}
.links{display:flex;gap:8px 15px;flex-wrap:wrap}
.sign{width:93px;height:93px;margin-top:17px;display:grid;place-items:center;color:#111;background:#ffc852;font-weight:850;text-align:center;line-height:1}
.sign.stop{clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:#bd282c;color:white;font-size:1.6rem}
.sign.yield{clip-path:polygon(0 0,100% 0,50% 100%);height:79px;background:#bd282c;padding-bottom:22px;color:white}
.sign.pennant{clip-path:polygon(0 0,100% 50%,0 100%);height:64px;width:111px;justify-items:start;padding-left:7px;font-size:.75rem}
.sign.school{clip-path:polygon(50% 0,100% 38%,100% 100%,0 100%,0 38%);background:#dceb52;font-size:.84rem;padding-top:22px}
.sign.rail{border-radius:50%;border:3px solid #1b201a;font-size:1.5rem}
.sign.slow{clip-path:polygon(50% 0,100% 94%,0 94%);background:#a92526}
.sign.slow::after{content:"";width:66%;height:66%;margin-top:10%;clip-path:polygon(50% 0,100% 94%,0 94%);background:#ff8a27}
.score{font-weight:800;font-size:clamp(2.4rem,7vw,4rem);letter-spacing:-.065em;line-height:1;margin:19px 0 8px;color:var(--green)}
.score span{font-size:1.35rem;letter-spacing:0;margin-left:.4rem}
.breakdown{display:grid;gap:8px;margin-top:18px;list-style:none;padding:0}
.breakdown li{display:flex;justify-content:space-between;gap:12px}
.review{margin-top:24px}
.review details{border-top:1px solid var(--line);padding:14px 0}
.review details:first-of-type{margin-top:9px}
.review summary{cursor:pointer;font-weight:650}
.review details p{margin:7px 0}
.review small{display:block}
.incorrect{color:#984427}
.correct{color:var(--green)}
@media(max-width:780px){.wrap{width:calc(100% - 32px)}main.wrap{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:18px}.hero .wrap{padding-block:29px 34px}.road{width:50%;opacity:.55}.aside{padding:18px 20px}.grid button{min-height:44px}.top .brand{min-height:57px}}
@media(max-width:360px){.actions .button{padding-inline:9px}}
</style>
<script defer src="questions.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">IA</span>Iowa Permit Practice</div></header>
<div class="hero"><div class="road" aria-hidden="true"></div><div class="wrap"><h1>Iowa permit practice test</h1><p>Answer 25 questions based on the Iowa Driver’s Manual. Score 20 or higher to meet the Iowa DOT passing target.</p></div></div>
<main class="wrap">
  <section class="card" id="quiz" aria-label="Practice test"></section>
  <aside class="card aside" id="sidebar" aria-label="Test progress"></aside>
</main>
<footer><div class="wrap"><span>Independent Iowa permit study tool</span><div class="links"><a id="manual-link" href="https://iowadot.gov/drivers-licenses-ids/driver-education/manuals-practice-tests/drivers-manual" target="_blank" rel="noopener">Iowa Driver’s Manual</a><a href="https://iowadot.gov/drivers-licenses-ids/driver-education/manuals-practice-tests/take-practice-test" target="_blank" rel="noopener">Official DOT practice test</a></div></div></footer>
<noscript><p class="wrap">Enable JavaScript to take the practice test.</p></noscript>
</body>
</html>
